[package]
name = "keydock"
version.workspace = true
edition.workspace = true
description = "KeyDock desktop login launcher"

[lib]
name = "keydock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
base64 = "0.22"
dirs = { workspace = true }
futures = "0.3"
keydock-browser = { path = "../crates/keydock-browser" }
keydock-core = { path = "../crates/keydock-core" }
keyring = { version = "3.6.3", features = ["windows-native", "apple-native"] }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.12.4", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-shell = "2.5.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
