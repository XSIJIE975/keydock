[workspace]
resolver = "2"
members = [
    "crates/keydock-core",
    "crates/keydock-browser",
    "src-tauri",
    "spikes/mouse-hook",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["XSIJIE"]
repository = "https://github.com/XSIJIE975/keydock"

[workspace.dependencies]
dirs = "6"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
# Phase 0 builds Tauri and a CDP spike repeatedly; keep incremental builds fast.
debug = 1

[profile.dev.package."*"]
opt-level = 1
